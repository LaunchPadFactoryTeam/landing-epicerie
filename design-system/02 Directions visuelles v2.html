<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3 directions visuelles · v2 · LaunchPad Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  #root { width: 100vw; height: 100vh; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="02_directions/design-canvas.jsx"></script>

  <script type="text/babel" src="02_directions/dir-a2-atelier-plus.jsx"></script>
  <script type="text/babel" src="02_directions/dir-b2-showroom-dark.jsx"></script>
  <script type="text/babel" src="02_directions/dir-c2-vitrine-neo.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;

    function App() {
      return (
        <DesignCanvas>

          {/* ═════════════ DIRECTION A — Atelier+ ═════════════ */}
          <DCSection
            id="dir-a2"
            title="Direction A · Atelier+"
            subtitle="L'ancienne direction C qui vous a plu, montée d'un cran. On garde Instrument Serif italic + Space Grotesk + la tagline « Le digital, fait main ». On ajoute un accent LIME acide pour la dopamine, une marquee animée en haut, des hover states visibles. La piste la plus proche de votre coup de cœur, mais plus vibrante.">

            <DCArtboard id="a2-id" label="A1 · Identité (palette, typo, boutons)" width={780} height={1020}>
              <DirA2_Identity />
            </DCArtboard>

            <DCArtboard id="a2-hero" label="A2 · Hero typographique XXL" width={1440} height={900}>
              <DirA2_Hero />
            </DCArtboard>

            <DCArtboard id="a2-cards" label="A3 · Showroom — cartes projets" width={1440} height={680}>
              <DirA2_Cards />
            </DCArtboard>

            <DCArtboard id="a2-pattern" label="A4 · Section « Le constat »" width={1440} height={680}>
              <DirA2_Pattern />
            </DCArtboard>
          </DCSection>

          {/* ═════════════ DIRECTION B — Showroom Dark ═════════════ */}
          <DCSection
            id="dir-b2"
            title="Direction B · Showroom Dark"
            subtitle="Le mode « studio tech premium ». Inspiration Hyperstack / Linear : fond off-black, accent violet électrique, dégradés de texte, ticker d'activité en live. Bricolage Grotesque + Inter Tight + Geist Mono. Pour transpirer la maîtrise technique. Trust + dopamine via la sophistication.">

            <DCArtboard id="b2-id" label="B1 · Identité" width={780} height={1020}>
              <DirB2_Identity />
            </DCArtboard>

            <DCArtboard id="b2-hero" label="B2 · Hero avec ticker live" width={1440} height={900}>
              <DirB2_Hero />
            </DCArtboard>

            <DCArtboard id="b2-cards" label="B3 · Showroom — cartes projets" width={1440} height={680}>
              <DirB2_Cards />
            </DCArtboard>

            <DCArtboard id="b2-pattern" label="B4 · Section « Le constat »" width={1440} height={680}>
              <DirB2_Pattern />
            </DCArtboard>
          </DCSection>

          {/* ═════════════ DIRECTION C — Vitrine Néo ═════════════ */}
          <DCSection
            id="dir-c2"
            title="Direction C · Vitrine Néo"
            subtitle="L'évolution mature de votre site Webflow actuel. On garde l'énergie « creative agency » (orange signature, formes circulaires, boldness graphique) mais on assagit le chaos. Bricolage Grotesque + Geist + Instrument Serif italic. Plus solaire, plus optimiste — l'agence créative qui sait coder.">

            <DCArtboard id="c2-id" label="C1 · Identité" width={780} height={1020}>
              <DirC2_Identity />
            </DCArtboard>

            <DCArtboard id="c2-hero" label="C2 · Hero avec disque signature" width={1440} height={900}>
              <DirC2_Hero />
            </DCArtboard>

            <DCArtboard id="c2-cards" label="C3 · Showroom — cartes projets" width={1440} height={680}>
              <DirC2_Cards />
            </DCArtboard>

            <DCArtboard id="c2-pattern" label="C4 · Section « Le constat »" width={1440} height={680}>
              <DirC2_Pattern />
            </DCArtboard>
          </DCSection>

        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
